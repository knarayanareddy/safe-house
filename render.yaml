services:
  - type: web
    name: safe-house-demo
    runtime: node
    rootDir: safehousebuilddemo
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DB_SCHEMA
        value: safehouse
      - key: DATABASE_URL
        sync: false
